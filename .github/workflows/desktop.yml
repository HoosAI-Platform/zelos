name: desktop builds

# The Windows installer cannot be built on the machine Zelos is developed on:
# NSIS needs Wine, which is not there. This runs the build on real Windows and
# real macOS runners and attaches the results to the run, which is the whole
# reason the project has CI at all.
#
# Deliberately manual (and tag-triggered): these are 100 MB+ artifacts and there
# is no reason to build them on every push.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # Electron packaging is slow but not unbounded; a hang here costs real
    # minutes on a Windows runner.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows installer
            script: dist:win
            out: 'desktop/dist/*setup*.exe'
          - os: macos-latest
            label: macos disk images
            script: dist:mac
            # The DMGs are for first installs; the ZIPs are what an installed
            # Zelos downloads and swaps itself for when it updates.
            out: |
              desktop/dist/*.dmg
              desktop/dist/*.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify release versions
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node -e 'const p=require("./package.json");const d=require("./desktop/package.json");if(process.env.GITHUB_REF_NAME!==`v${p.version}`||d.version!==p.version)throw Error("Release tag and app versions disagree")'

      # The app itself has no dependencies; the SHELL has two build-time ones.
      # No fallback after `npm ci`: the tracked lockfile is the pin an unsigned
      # build is trusted on, so a lockfile that no longer matches must fail the
      # build loudly here — not fall through to a fresh resolution that builds
      # green with the workflow log as the only trace.
      - name: Install the shell's build tools
        working-directory: desktop
        run: npm ci

      # The suite runs before anything is packaged: an installer built from a
      # failing tree is worse than no installer.
      - name: Run the suite
        shell: bash
        run: node --test --test-timeout=180000 test/*.test.mjs

      # The commit is stamped into the packaged app's package.json, where
      # desktop/main.js reads it for About and the "shell ready" log line —
      # without it every build is "Zelos <version>" and "which build do you
      # have?" has no answer. The whole sha, not the short one: a short sha
      # that happens to be all digits reaches electron-builder's argument
      # parser as a number; main.js shows the first seven.
      - name: Build
        working-directory: desktop
        # bash on both runners: PowerShell reads `-c.extraMetadata.commit=…` as the
        # parameter `-c` followed by a bare word, and electron-builder then went
        # looking for a config FILE named `.extraMetadata.commit=<sha>`. The suite
        # step above already runs under bash for the same family of reason.
        shell: bash
        run: npm run ${{ matrix.script }} -- -c.extraMetadata.commit=${{ github.sha }}
        env:
          # Unsigned on purpose. macOS builds are ad-hoc signed by the config
          # (identity "-"), Windows is unsigned; both are documented in
          # docs/INSTALL.md rather than papered over.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Check the packaged native runtime and first-run server
        run: node scripts/check-desktop.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: zelos-${{ matrix.os }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    # The update key lives in this environment, which RELEASING.md sets up to
    # need a reviewer's approval and to accept only v* tags, so pushing a
    # branch or a workflow cannot read it and pushing a tag cannot use it
    # without that approval.
    environment: release
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: zelos-*
          merge-multiple: true
          path: release-assets
      - name: Prepare exact source
        run: git archive --format=zip --prefix=zelos/ --output=release-assets/zelos-source.zip HEAD
      # The private Ed25519 update key (scripts/generate-update-key.mjs) is a
      # secret of the protected `release` environment — reviewer approval,
      # v* tags only — and reaches this one step and nothing else. The script
      # signs release.json with it, and refuses to continue without it once
      # desktop/package.json carries public keys.
      - name: Write checksums and sign the release manifest
        env:
          ZELOS_UPDATE_SIGNING_KEY: ${{ secrets.ZELOS_UPDATE_SIGNING_KEY }}
          ZELOS_UPDATE_KEY_TRANSITION: ${{ vars.ZELOS_UPDATE_KEY_TRANSITION }}
        run: node scripts/prepare-release.mjs
      - name: Build the matching website
        run: node scripts/build-website.mjs
      - name: Preserve matching website
        uses: actions/upload-artifact@v4
        with:
          name: zelos-website
          path: .site-dist
          include-hidden-files: true
          if-no-files-found: error
      - name: Publish installers, source, checksums and signature
        env:
          GH_TOKEN: ${{ github.token }}
          ZELOS_UPDATE_KEY_TRANSITION: ${{ vars.ZELOS_UPDATE_KEY_TRANSITION }}
        run: node scripts/publish-release.mjs
